name: Backend Docker Publish

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-docker-publish.yml'

jobs:
  build-and-push:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - name: Build bootJar (테스트 제외)
        run: ./gradlew clean bootJar -x test --no-daemon

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # EC2가 arm64(Graviton)라 amd64 전용으로 빌드하면 "no matching manifest" 로 pull이 실패한다.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/trip:${{ github.base_ref }}
            ${{ secrets.DOCKERHUB_USERNAME }}/trip:${{ github.base_ref }}-${{ github.event.pull_request.number }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ec2-user/app
            umask 077
            cat > .env <<'EOF'
            IMAGE_TAG='${{ github.base_ref }}'
            DOCKERHUB_USERNAME='${{ secrets.DOCKERHUB_USERNAME }}'
            EOF
            docker compose pull backend
            docker compose up -d
            docker image prune -f
