# 배포 서버용 백엔드 compose 파일.
# CI(backend-docker-publish.yml) 가 DockerHub 에 이미지를 올린 뒤, 이 서버에 SSH 로 접속해
# .env 를 새로 써서(heredoc) pull/up 까지 자동으로 수행한다. (이미지에는 시크릿이 들어있지
# 않다 — jar 만 들어있음. .env 는 CI 가 매 배포마다 덮어쓰므로 서버에 수동으로 둘 필요 없음)
#
# 이 파일은 EC2 인스턴스의 /home/ec2-user/app/docker-compose.yml 에 미리 배치돼 있어야 한다
# (Amazon Linux 인스턴스라 홈이 /home/ubuntu 가 아니라 /home/ec2-user 다).
#
# 수동으로 재기동해야 할 때 (서버에서 직접):
#   1) docker compose pull   # 최신 이미지 받기
#   2) docker compose up -d   # 백그라운드 기동
#   3) docker compose logs -f # 로그 확인
#
# 이미지 태그/계정은 환경변수로 덮어쓸 수 있다 (.env 에 이미 들어있음):
#   DOCKERHUB_USERNAME=myid IMAGE_TAG=main docker compose up -d
#

services:
  backend:
    image: ${DOCKERHUB_USERNAME:-dlsnfl0615}/trip:${IMAGE_TAG:-main}
    container_name: trip-backend
    restart: always
    ports:
      - "8080:8080"   # API
      # 액츄에이터. 모니터링이 다른 인스턴스에 있으므로 호스트에 공개해야 한다.
      # EC2 는 공인 IP 를 IGW 가 NAT 하므로 바인딩 주소로는 막을 수 없다 —
      # 보안그룹에서 8081 을 모니터링 인스턴스 SG 로만 제한하는 것이 유일한 방어선이다.
      - "8081:8081"
    # 메모리 예산. 백엔드 인스턴스는 물리 RAM 908MB(vCPU 2)이고 OS·docker 몫을 빼면
    # 앱에 700~750MB 를 줄 수 있다. 아래 JVM 옵션 합계가 약 679MB 라 800m 안에 들어간다.
    #
    # memswap_limit 을 mem_limit 과 같게 두어 스왑을 봉쇄한다. GC 는 힙을 랜덤 액세스로 훑기
    # 때문에 스왑이 최악의 워크로드이고, t3 는 EBS 스왑이라 IO 버스트 크레딧까지 태운다.
    # 예전 설정(640m/896m)은 스왑 256m 를 열어두고 그 위에서 겨우 버티다 6초 STW 를 냈다.
    mem_limit: 800m
    memswap_limit: 800m
    # application.properties 의 ${DATABASE_URL} 등을 이 파일 값으로 주입
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      # glibc 가 스레드마다 malloc arena 를 파서 RSS 가 부푸는 것을 막는다.
      MALLOC_ARENA_MAX: "2"
      # 메타스페이스 256m: 2026-08-13 부하테스트에서 160m 상한이 used 159MiB 로 꽉 차
      # Metadata GC 가 Clear Soft References 단계까지 반복되다 OutOfMemoryError: Metaspace 로
      # 죽었다. springdoc-openapi + AWS SDK v2 + BouncyCastle + Hibernate 조합은 클래스가
      # 30K 개(약 150MB)라 160m 로는 기동만으로 이미 포화 직전이었다.
      # 힙 192m: 같은 구간 실사용이 133MiB 라 여유가 있어 그대로 둔다(이번 사건과 무관).
      # -Xss512k: 스레드 스택이 기본 1MB 라 246개 × 1MB = 246MB 로 예산에서 가장 큰 덩어리였다.
      #           application.properties 의 server.tomcat.threads.max 축소와 함께 줄인다.
      JAVA_TOOL_OPTIONS: >-
        -Duser.timezone=Asia/Seoul
        -Xms192m
        -Xmx192m
        -XX:MaxMetaspaceSize=256m
        -XX:ReservedCodeCacheSize=48m
        -XX:MaxDirectMemorySize=48m
        -Xss512k
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/dump
    volumes:
      # 힙덤프 보존용. 마운트가 없으면 컨테이너 안에 쓰였다가 재기동 때 사라지고,
      # /dump 디렉토리가 없으면 덤프 생성 자체가 실패한다.
      - ./dump:/dump
