server {
    listen 80;
    server_name samsam55.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name samsam55.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/samsam55.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/samsam55.duckdns.org/privkey.pem;

    # Mozilla Intermediate 기준 (ECDHE 계열만 써서 커스텀 dhparam이 필요 없음)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # Docker 내장 DNS(127.0.0.11)로 매 요청마다 재조회한다. proxy_pass 대상을 고정
    # 문자열로 쓰면 nginx가 기동 시점에 한 번만 resolve하고 캐시해버려서, 백엔드가
    # 재배포로 재생성(새 컨테이너 IP)될 때마다 502가 난다 — 변수로 감싸야 매 요청
    # 시점에 resolver로 다시 조회한다.
    resolver 127.0.0.11 valid=10s;

    location / {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
